scout_slam_node:
  ros__parameters:
    # Subscription
    rgb_topic: "/drone/camera/color/image_raw"
    depth_topic: "/drone/camera/depth/image_rect_raw"
    imu_topic: "/drone/camera/imu"

    # Input/Output
    start_offset_sec: 5.0
    finish_time_sec: 20.0
    bag_path: "/opt/OA-SLAM/Data/vicon_dataset/room_1_1"
    output_folder: "/opt/OA-SLAM/Data/run/vicon_dataset/room_1_1/"  # Base directory for timestamped TUM output

    # Register raw depth pixels into the RGB optical frame before RGB-D SLAM.
    depth_alignment_enabled: true
    depth_alignment_rotation_is_column_major: true
    depth_alignment_depth_unit_scale: 0.001
    depth_alignment_rgb_intrinsics: [605.194580078125, 604.2938232421875, 313.7639465332031, 238.30349731445312]
    depth_alignment_depth_intrinsics: [378.8534851074219, 378.8534851074219, 318.66583251953125, 237.22059631347656]
    depth_alignment_depth_to_rgb_rotation: [
      0.9999053478240967, -0.012793170288205147, -0.005052417982369661,
      0.01281267311424017, 0.9999105334281921, 0.0038465538527816534,
      0.005002756603062153, -0.00391092523932457, 0.9999798536300659
    ]
    depth_alignment_depth_to_rgb_translation: [0.0148990573361516, -0.00019538396736606956, 0.00014606618788093328]

    # Publishers
    pose_topic: "/agent_1/camera_pose"
    local_pose_topic: "/agent_1/submap_pose"
    world_frame_id: "map"
    agent_id: "agent_1"
    local_semantic_map_snapshot_topic: "/agent_1/semantic_map_snapshot"
    local_semantic_map_delta_topic: "/agent_1/semantic_map_delta"

    # SLAM Backend
    vocabulary_file: "/opt/OA-SLAM/Vocabulary/ORBvoc.txt"
    camera_settings_file: "/opt/OA-SLAM/ros2/oaslam_ros2_wrapper/config/camera/realsense_d435i.yaml"
    use_viewer: true
    use_imu: false
    use_sim_time: false

    # Observation Source
    observation_mode: "onnx"  # "onnx", "file", or "none"
    detection_model_path: "/opt/OA-SLAM/Data/yolov5m_640x480.onnx"
    detection_file_path: ""
    # Filters COCO classes that are usually dynamic in SLAM maps: person,
    # vehicles, and animals. COCO does not expose hands/arms separately, so
    # those aliases are treated as person when used in an ignored category file.
    ignore_dynamic_categories: false
    ignored_categories_file: ""

    # Relocalization
    relocalization_mode: "points_and_objects"  # "points", "objects", or "points_and_objects"
