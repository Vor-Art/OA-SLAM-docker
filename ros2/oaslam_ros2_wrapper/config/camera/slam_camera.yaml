%YAML:1.0
---

#--------------------------------------------------------------------------------------------
# System Parameters
#--------------------------------------------------------------------------------------------
File.version: "1.0"
Camera.type: "PinHole"

#--------------------------------------------------------------------------------------------
# Camera Parameters: Generic RGB pinhole camera
#--------------------------------------------------------------------------------------------
# This profile keeps the non-IMU OA-SLAM camera settings in the same layout as
# the RGB-D + IMU profile below.
Camera.fx: 605.642333984375
Camera.fy: 605.6187133789062
Camera.cx: 325.03326416015625
Camera.cy: 237.22653198242188

Camera.k1: 0.0
Camera.k2: 0.0
Camera.k3: 0.0
Camera.k4: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

Camera.width: 640
Camera.height: 480
Camera.fps: 60
Camera.RGB: 1  # Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)

#--------------------------------------------------------------------------------------------
# Detector Parameters
#--------------------------------------------------------------------------------------------
Model.width: 640
Model.height: 480

# # Save per-frame detections in OA-SLAM JSON format (0/1 or false/true).
# save_detections: 1
Detector.CenterReprojectionThresholdPx: 50.0

#--------------------------------------------------------------------------------------------
# Debug Parameters
#--------------------------------------------------------------------------------------------
# Emit a compact object-tracking report every N frames. Set to 0 to disable.
Debug.FrameReportInterval: 10


#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8

# Image is divided into a grid. At each cell FAST corners are extracted with a
# minimum response threshold. If no corners are found with iniThFAST, the lower
# minThFAST threshold is used.
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.02
Viewer.KeyFrameLineWidth: 0.8
Viewer.GraphLineWidth: 0.6
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.04
Viewer.CameraLineWidth: 2.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
