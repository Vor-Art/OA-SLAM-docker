%YAML:1.0
---

#--------------------------------------------------------------------------------------------
# System Parameters
#--------------------------------------------------------------------------------------------
File.version: "1.0"
Camera.type: "PinHole"

#--------------------------------------------------------------------------------------------
# Camera Parameters: Intel RealSense D435i RGB-D + IMU
#--------------------------------------------------------------------------------------------
# Single-camera configs use the Camera / Depth / IMU section names directly.
Camera.fx: 605.642333984375
Camera.fy: 605.6187133789062
Camera.cx: 325.03326416015625
Camera.cy: 237.22653198242188

Camera.k1: 0.0
Camera.k2: 0.0
Camera.k3: 0.0
Camera.k4: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

Camera.width: 640
Camera.height: 480
Camera.fps: 60
Camera.RGB: 1  # Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)

#--------------------------------------------------------------------------------------------
# Detector Parameters
#--------------------------------------------------------------------------------------------
Model.width: 640
Model.height: 480

# # Save per-frame detections in OA-SLAM JSON format (0/1 or false/true).
# save_detections: 1

#--------------------------------------------------------------------------------------------
# Depth Parameters
#--------------------------------------------------------------------------------------------
# D435i depth is reported in millimeters. ORB-SLAM3 expects meters.
Depth.MapFactor: 1000.0

# Threshold for classifying close and far RGB-D points.
Depth.ThDepth: 40.0
Depth.Baseline: 0.05

# Stereo baseline (meters) multiplied by fx. Used internally for RGB-D depth
# to disparity conversion.
Camera.bf: 48.45

#--------------------------------------------------------------------------------------------
# IMU Parameters: Bosch BMI055
#--------------------------------------------------------------------------------------------
IMU.NoiseGyro: 1.7e-4
IMU.NoiseAcc: 2.0e-3
IMU.GyroWalk: 1.9393e-5
IMU.AccWalk: 3.0e-3
IMU.Frequency: 200.0
IMU.InsertKFsWhenLost: 1
IMU.fastInit: false

#--------------------------------------------------------------------------------------------
# IMU Extrinsics
#--------------------------------------------------------------------------------------------
IMU.T_b_c: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [ 1.0, 0.0, 0.0, 0.0115,
          0.0, 1.0, 0.0, -0.0055,
          0.0, 0.0, 1.0, -0.0117,
          0.0, 0.0, 0.0, 1.0 ]

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8

# Image is divided into a grid. At each cell FAST corners are extracted with a
# minimum response threshold. If no corners are found with iniThFAST, the lower
# minThFAST threshold is used.
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.02
Viewer.KeyFrameLineWidth: 0.8
Viewer.GraphLineWidth: 0.6
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.04
Viewer.CameraLineWidth: 2.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
